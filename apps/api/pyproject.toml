[tool.ruff]
line-length = 100
target-version = "py311"
# Generated once, run once, never hand-edited again after review — excluded
# from lint the same way most Alembic setups exclude versions/.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
